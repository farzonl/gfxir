[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlir-gpu"
version = "0.1.0"
description = "Python-authored graphics programs lowered through MLIR to native GPU formats"
requires-python = ">=3.11"

[project.optional-dependencies]
viewer = ["vulkan>=1.3.275.1,<2", "glfw>=2.7,<3"]

[project.scripts]
mlir-gpu = "mlir_gpu.__main__:main"
mlir-gpu-view = "mlir_gpu.viewer:main"

[tool.setuptools.packages.find]
where = ["src"]
