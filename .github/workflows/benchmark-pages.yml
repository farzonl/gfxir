name: macOS GPU Benchmarks & Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: benchmark-pages-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  macos-benchmark:
    name: Benchmark (NumPy vs GfxIR macOS backends)
    runs-on: macos-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python package with viewer and benchmark dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[viewer,bench]'

      - name: Ensure Ninja and Nacelle runtime dependencies are installed (macOS)
        run: |
          command -v ninja >/dev/null 2>&1 || brew install ninja
          brew list --versions zstd >/dev/null 2>&1 || brew install zstd

      - name: Restore GPU SDK dependencies cache
        id: cache-gpu-sdk
        uses: actions/cache/restore@v4
        with:
          path: .sdk
          key: gpu-sdk-${{ runner.os }}-${{ runner.arch }}-dxc1.9.2609-vk1.4.357.0-msc4.0b3

      - name: Install Vulkan SDK & Metal Shader Converter (fallback)
        if: steps.cache-gpu-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sdk/bin .sdk/include .sdk/lib .sdk/share/vulkan
          VULKAN_VER="1.4.357.0"
          curl -fsSL "https://sdk.lunarg.com/sdk/download/${VULKAN_VER}/mac/vulkansdk-macos-${VULKAN_VER}.zip" -o /tmp/vulkansdk.zip
          unzip -q /tmp/vulkansdk.zip -d /tmp/vulkansdk-installer
          INSTALLER_APP="$(find /tmp/vulkansdk-installer -maxdepth 2 -name '*.app' | head -n 1)"
          INSTALLER_BIN="${INSTALLER_APP}/Contents/MacOS/$(basename "${INSTALLER_APP}" .app)"
          "${INSTALLER_BIN}" --root "/tmp/vulkansdk" --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.core
          cp -a /tmp/vulkansdk/macOS/bin/spirv-val .sdk/bin/
          cp -a /tmp/vulkansdk/macOS/include/dxc .sdk/include/
          cp -a /tmp/vulkansdk/macOS/lib/libdxcompiler* .sdk/lib/
          cp -a /tmp/vulkansdk/macOS/lib/libvulkan* .sdk/lib/
          cp -a /tmp/vulkansdk/macOS/lib/libMoltenVK* .sdk/lib/
          cp -a /tmp/vulkansdk/macOS/lib/libVkLayer_khronos_validation* .sdk/lib/
          cp -a /tmp/vulkansdk/macOS/share/vulkan/icd.d .sdk/share/vulkan/
          cp -a /tmp/vulkansdk/macOS/share/vulkan/explicit_layer.d .sdk/share/vulkan/
          rm -rf /tmp/vulkansdk /tmp/vulkansdk-installer /tmp/vulkansdk.zip

          # Metal Shader Converter 4.0 beta 3 (.pkg)
          curl -fsSL "https://drive.usercontent.google.com/download?id=1JJ9KhEtHPKfBN6yuXVL8QikTxsqTDA0B&export=download&confirm=t" \
            -o /tmp/msc.pkg
          pkgutil --expand-full /tmp/msc.pkg /tmp/msc-expanded
          MSC_USR="/tmp/msc-expanded/MetalShaderConverter.pkg/Payload/usr/local"
          cp -a "${MSC_USR}/bin/"* .sdk/bin/
          cp -a "${MSC_USR}/lib/"* .sdk/lib/
          cp -a "${MSC_USR}/include/"* .sdk/include/
          chmod +x .sdk/bin/metal-shaderconverter
          rm -rf /tmp/msc.pkg /tmp/msc-expanded

      - name: Cache Nacelle release SDK
        id: cache-nacelle
        uses: actions/cache@v4
        with:
          path: .sdk/nacelle
          key: nacelle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/setup_nacelle.py') }}

      - name: Install pinned Nacelle release binaries
        if: steps.cache-nacelle.outputs.cache-hit != 'true'
        run: python3 tools/setup_nacelle.py

      - name: Restore compiled gfx compiler & LLVM runtime binaries
        id: cache-compiler-binaries
        uses: actions/cache/restore@v4
        with:
          path: |
            .toolchains/llvm-build/bin/gfx-opt
            .toolchains/llvm-build/bin/gfx-compile
            .toolchains/llvm-build/bin/llc
            .toolchains/llvm-build/bin/llvm-config
            .toolchains/llvm-build/bin/FileCheck
            .toolchains/llvm-build/bin/split-file
          key: gfx-compiler-bins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/llvm-revision.txt', 'tools/build_toolchain.py', 'native/compiler/**') }}

      - name: Build pinned LLVM/MLIR toolchain and gfx compiler (fallback)
        if: steps.cache-compiler-binaries.outputs.cache-hit != 'true'
        run: |
          JOBS="$(python3 -c 'import os; print(os.cpu_count() or 4)')"
          python3 tools/build_toolchain.py --jobs "$JOBS"

      - name: Restore native helper binaries
        id: cache-native-tools
        uses: actions/cache/restore@v4
        with:
          path: .tools/bin
          key: native-tools-bins-${{ runner.os }}-${{ runner.arch }}-msc4.0b3-${{ hashFiles('CMakeLists.txt', 'native/dxil_tool.cpp', 'native/metal_viewer.mm', 'native/directx_viewer.cpp', 'native/directx_compute_bridge.cpp', 'native/nacelle_compat.h', 'examples/minigfx/_directx_bridge.cpp', 'tools/setup_nacelle.py') }}

      - name: Build native helper binaries (fallback)
        if: steps.cache-native-tools.outputs.cache-hit != 'true'
        run: |
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          cmake -S . -B build/native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/.sdk" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.tools" \
            -DNACELLE_ROOT="$GITHUB_WORKSPACE/.sdk/nacelle" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_OSX_SYSROOT="$SDK_PATH"
          cmake --build build/native
          cmake --install build/native

      - name: Run NumPy vs GfxIR benchmarks (macOS backends)
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          export LLVM_BIN="$GITHUB_WORKSPACE/.toolchains/llvm-build/bin"
          export PATH="$GITHUB_WORKSPACE/.tools/bin:$GITHUB_WORKSPACE/.sdk/bin:$PATH"
          export DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/.sdk/lib:${DYLD_LIBRARY_PATH:-}"
          export VK_ADD_LAYER_PATH="$GITHUB_WORKSPACE/.sdk/share/vulkan/explicit_layer.d"

          BENCH_FILES=()

          MOLTENVK_ICD="$GITHUB_WORKSPACE/.sdk/share/vulkan/icd.d/MoltenVK_icd.json"
          if [ -f "$MOLTENVK_ICD" ]; then
            echo "Benchmarking Vulkan (MoltenVK)..."
            VK_ICD_FILENAMES="$MOLTENVK_ICD" VK_DRIVER_FILES="$MOLTENVK_ICD" \
              python3 scripts/run_numpy_benchmarks.py \
                --target vulkan \
                --backend-label gfxir-vulkan-moltenvk \
                --preset full \
                --warmup 2 \
                --iters 5 \
                --require-gpu \
                --out "$GITHUB_WORKSPACE/bench-moltenvk.json"
            BENCH_FILES+=("$GITHUB_WORKSPACE/bench-moltenvk.json")
          fi

          KOSMIC_ICD="$GITHUB_WORKSPACE/.sdk/share/vulkan/icd.d/libkosmickrisp_icd.json"
          if [ -f "$KOSMIC_ICD" ]; then
            echo "Benchmarking Vulkan (KosmicKrisp)..."
            VK_ICD_FILENAMES="$KOSMIC_ICD" VK_DRIVER_FILES="$KOSMIC_ICD" \
              python3 scripts/run_numpy_benchmarks.py \
                --target vulkan \
                --backend-label gfxir-vulkan-kosmickrisp \
                --preset full \
                --warmup 2 \
                --iters 5 \
                --require-gpu \
                --out "$GITHUB_WORKSPACE/bench-kosmickrisp.json"
            BENCH_FILES+=("$GITHUB_WORKSPACE/bench-kosmickrisp.json")
          else
            echo "Notice: KosmicKrisp ICD not found at $KOSMIC_ICD; skipping KosmicKrisp benchmark."
          fi

          if swift -e 'import Metal; guard let d = MTLCreateSystemDefaultDevice(), d.argumentBuffersSupport == .tier2 else { exit(1) }' 2>/dev/null; then
            echo "Metal Argument Buffers Tier 2 device detected; benchmarking Metal target."
            python3 scripts/run_numpy_benchmarks.py \
              --target metal \
              --backend-label gfxir-metal \
              --preset full \
              --warmup 2 \
              --iters 5 \
              --require-gpu \
              --out "$GITHUB_WORKSPACE/bench-metal.json"
            BENCH_FILES+=("$GITHUB_WORKSPACE/bench-metal.json")
          else
            echo "Notice: Metal Argument Buffers Tier 2 unavailable on this runner; skipping Metal benchmark."
          fi

          echo "Checking gfxpy through DirectX/Nacelle (CPU software execution)..."
          python3 -m examples.gfxpy.chain_example --target directx --provider nacelle
          echo "Benchmarking DirectX/Nacelle against the same full NumPy workload..."
          python3 scripts/run_numpy_benchmarks.py \
            --target directx \
            --provider nacelle \
            --backend-label gfxir-directx-nacelle \
            --preset full \
            --warmup 2 \
            --iters 5 \
            --require-all \
            --out "$GITHUB_WORKSPACE/bench-nacelle.json"
          BENCH_FILES+=("$GITHUB_WORKSPACE/bench-nacelle.json")

          echo "BENCH_ARGS=${BENCH_FILES[*]}" >> "$GITHUB_ENV"

      - name: Restore historical benchmark data cache
        uses: actions/cache/restore@v4
        with:
          path: .bench-cache
          key: bench-history-${{ github.event.workflow_run.head_sha || github.sha }}
          restore-keys: |
            bench-history-

      - name: Build benchmark website
        run: |
          TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          MSG="$(git log -1 --pretty=%s)"
          AUTHOR="$(git log -1 --pretty=%an)"
          TS="$(git log -1 --pretty=%cI)"
          read -r -a BENCH_FILES <<< "$BENCH_ARGS"
          python3 scripts/build_benchmark_site.py \
            --bench-json "${BENCH_FILES[@]}" \
            --site-src "$GITHUB_WORKSPACE/pages" \
            --out-dir "$GITHUB_WORKSPACE/_site" \
            --sha "$TARGET_SHA" \
            --message "$MSG" \
            --author "$AUTHOR" \
            --timestamp "$TS" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --pages-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --history-cache "$GITHUB_WORKSPACE/.bench-cache/bench-history.json"

      - name: Save historical benchmark data cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .bench-cache
          key: bench-history-${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
